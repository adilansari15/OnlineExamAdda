services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examadda-backend
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-ProductionSuperSecretSigningKeyAtLeast32BytesLongForSecurity!}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-480}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@examadda.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: examadda-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

